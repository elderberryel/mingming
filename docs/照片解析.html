<style>

body{
    margin:0;
    background:#0f1117;

    border:2px dashed #4a5568;

    max-width:100%; max-height:300px;
    border-radius:16px;
    box-shadow:0 10px 20px rgba(0,0,0,0.5);

}

    background:#161b22;

}
pre{
    white-space:pre-wrap;
    word-break:break-word;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size:12px;
    background:#0c0f15;
    padding:10px;
    border-radius:12px;

    max-height:460px;
    overflow-y:auto;
    color:#cbd5e6;
    margin:0;
}
.loading{ color:#2dd4bf; animation:pulse 1.2s infinite; }
@keyframes pulse{ 0%{opacity:.5} 100%{opacity:1} }
button, .key-btn{
    background:#1f2a3e; border:none; color:white;

}
button:hover, .key-btn:hover{ background:#2d3a5e; border-color:#5b8cbc; }
input.key-input{
    background:#0f1117; border:1px solid #334155;
    border-radius:20px; padding:12px 15px;
    color:white; width:100%; font-size:0.9rem;
    margin:10px 0; font-family: monospace;
}
.key-control{
    background:#10141c; border-radius:18px;
    padding:12px; margin-bottom:12px;
}
.address-result{
    background:#0c0f15; border-radius:15px;
    padding:12px; font-size:13px; line-height:1.4;
}
.status-badge{
    background:#1e293b; border-radius:15px;
    padding:4px 12px; display:inline-block;
    font-size:11px; margin-bottom:8px;
}
.coord-info{ font-size:11px; color:#9ca3af; margin-top:8px; }
.success-box{
    background:#052e16; border:1px solid #15803d;
    border-radius:12px; padding:12px;
    margin-top:12px; font-size:13px; color:#4ade80;
}
.lib-badge{
    display:inline-block; padding:2px 8px;
    border-radius:8px; font-size:10px; font-weight:bold;
}
.lib-exifr{ background:#1e3a5f; color:#60a5fa; }
.lib-exifreader{ background:#3b1f5e; color:#c084fc; }
</style>
</head>
<body>

<header>📸 照片解析器</header>

<div class="container">

<div class="upload" id="uploadBox">
    📂 点击上传照片 (支持JPG/PNG/HEIC)
    <input type="file" id="fileInput" accept="image/*">
</div>

<div class="preview">
    <img id="previewImg" alt="预览区域">
</div>

<div style="text-align:center; margin-top:10px;">
    <span id="exifrStatus" class="lib-badge lib-exifr">Exifr: 检测中...</span>
    <span id="exifreaderStatus" class="lib-badge lib-exifreader">ExifReader: 检测中...</span>
</div>

<div class="card">
<h2>📄 基础信息</h2>
<pre id="basicInfo">等待图片...</pre>
</div>

<div class="card">
<h2>🗺️ EXIF & 坐标</h2>
<pre id="exifInfo">暂无EXIF数据</pre>
</div>

<div class="card">
<h2>📍 地址解析</h2>
<div class="key-control">
    <div style="font-size:13px; margin-bottom:8px;">🔑 腾讯地图 Key (可选)</div>
    <input type="text" id="tencentKeyInput" class="key-input" placeholder="输入腾讯Key显示详细地址">
    <div style="font-size:11px; color:#6b7280; margin:5px 0;">
        👉 <a href="https://lbs.qq.com/dev/console/application/mine" target="_blank" style="color:#60a5fa;">申请Key</a> (选择Web服务API)
    </div>
    <button id="saveKeyBtn" class="key-btn">💾 保存Key</button>
    <button id="manualReverseBtn" class="key-btn">🔄 获取地址</button>
</div>

<div id="reverseGeoContainer">
    <div class="status-badge" id="geoStatusIcon">🌐 等待GPS坐标</div>
    <div id="geoAddressDisplay" class="address-result">
        <span style="color:#6c86a3;">上传含GPS照片后自动解析</span>
    </div>
    <div id="coordDebug" class="coord-info"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');
const previewImg = document.getElementById('previewImg');
const basicInfo = document.getElementById('basicInfo');
const exifInfo = document.getElementById('exifInfo');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const tencentKeyInput = document.getElementById('tencentKeyInput');
const saveKeyBtn = document.getElementById('saveKeyBtn');
const manualReverseBtn = document.getElementById('manualReverseBtn');
const geoAddressDisplay = document.getElementById('geoAddressDisplay');
const geoStatusIcon = document.getElementById('geoStatusIcon');
const coordDebugSpan = document.getElementById('coordDebug');

let currentGcjLng = null;
let currentGcjLat = null;
let hasValidGpsCoord = false;
let currentKey = '';
let trueSize = null;
let currentFile = null;

const STORAGE_KEY_TENCENT = 'tencent_key_mobile';

const LIB_STATUS = {
    EXIFR: typeof exifr !== 'undefined',
    EXIFREADER: typeof ExifReader !== 'undefined',
    HEIC2ANY: typeof heic2any !== 'undefined'
};

function updateLibStatus() {
    document.getElementById('exifrStatus').textContent = `Exifr: ${LIB_STATUS.EXIFR ? '✅' : '❌'}`;
    document.getElementById('exifreaderStatus').textContent = `ExifReader: ${LIB_STATUS.EXIFREADER ? '✅' : '❌'}`;
}

function readSizeFromHeader(buffer) {
    const view = new DataView(buffer);
    if (view.byteLength < 24) return null;

    // ---- JPEG ----
    if (view.getUint16(0) === 0xFFD8) {
        let offset = 2;
        const len = view.byteLength;
        while (offset + 9 < len) {
            if (view.getUint8(offset) !== 0xFF) { offset++; continue; }
            const marker = view.getUint8(offset + 1);
            if (marker === 0xD8 || marker === 0x01 || (marker >= 0xD0 && marker <= 0xD7)) {
                offset += 2; continue;
            }
            if (marker === 0xD9 || marker === 0xDA) break;
            const segLen = view.getUint16(offset + 2);
            if (segLen < 2) break;
            if (marker >= 0xC0 && marker <= 0xCF &&
                marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC) {
                return {
                    width:  view.getUint16(offset + 7),
                    height: view.getUint16(offset + 5)
                };
            }
            offset += 2 + segLen;
        }
        return null;
    }

    // ---- PNG ----
    if (view.getUint32(0) === 0x89504E47) {
        return { width: view.getUint32(16), height: view.getUint32(20) };
    }

    // ---- WebP ----
    if (view.getUint32(0) === 0x52494646 && view.getUint32(8) === 0x57454250) {
        const f = String.fromCharCode(
            view.getUint8(12), view.getUint8(13), view.getUint8(14), view.getUint8(15)
        );
        if (f === 'VP8X') {
            return {
                width:  1 + (view.getUint8(24) | (view.getUint8(25) << 8) | (view.getUint8(26) << 16)),
                height: 1 + (view.getUint8(27) | (view.getUint8(28) << 8) | (view.getUint8(29) << 16))
            };
        }
        if (f === 'VP8 ') {
            return {
                width:  view.getUint16(26, true) & 0x3FFF,
                height: view.getUint16(28, true) & 0x3FFF
            };
        }
        if (f === 'VP8L') {
            const b = view.getUint8(21) | (view.getUint8(22) << 8) |
                      (view.getUint8(23) << 16) | (view.getUint8(24) << 24);
            return { width: (b & 0x3FFF) + 1, height: ((b >> 14) & 0x3FFF) + 1 };
        }
    }

    return null;
}

async function getTrueImageSize(blob) {
    try {
        const head = await blob.slice(0, 1024 * 1024).arrayBuffer();
        return readSizeFromHeader(head);
    } catch (e) {
        console.warn('读取文件头尺寸失败:', e);
        return null;
    }
}

async function isHeicFile(file) {
    const type = (file.type || '').toLowerCase();
    if (type === 'image/heic' || type === 'image/heif' ||
        type === 'image/heic-sequence' || type === 'image/heif-sequence') return true;

    const name = (file.name || '').toLowerCase();
    if (name.endsWith('.heic') || name.endsWith('.heif')) return true;

    try {
        const head = await file.slice(0, 32).arrayBuffer();
        const view = new DataView(head);
        if (view.byteLength < 12) return false;
        const ftyp = String.fromCharCode(
            view.getUint8(4), view.getUint8(5), view.getUint8(6), view.getUint8(7)
        );
        if (ftyp !== 'ftyp') return false;
        const brand = String.fromCharCode(
            view.getUint8(8), view.getUint8(9), view.getUint8(10), view.getUint8(11)
        ).toLowerCase();
        const heicBrands = ['heic','heix','hevc','hevx','heim','heis','hevm','hevs','mif1','msf1'];
        return heicBrands.includes(brand);
    } catch (e) {
        return false;
    }
}

function readHeicSize(buffer) {
    const view = new DataView(buffer);
    const bytes = new Uint8Array(buffer);
    const len = bytes.length;

    let best = null;
    for (let i = 4; i < len - 16; i++) {
        if (bytes[i] === 0x69 && bytes[i+1] === 0x73 &&
            bytes[i+2] === 0x70 && bytes[i+3] === 0x65) {
            const width  = view.getUint32(i + 8);
            const height = view.getUint32(i + 12);
            if (width > 0 && height > 0 && width < 200000 && height < 200000) {
                if (!best || (width * height > best.width * best.height)) {
                    best = { width, height };
                }
            }
        }
    }
    return best;
}

async function getHeicTrueSize(file) {
    try {
        const head = await file.slice(0, 4 * 1024 * 1024).arrayBuffer();
        return readHeicSize(head);
    } catch (e) {
        return null;
    }
}

function generateMapLinks(lat, lng) {
    return `
        <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
            <a href="https://uri.amap.com/marker?position=${lng},${lat}&name=照片位置" 
               target="_blank" 
               style="background:#1a472a; color:white; padding:10px 15px; border-radius:15px; text-decoration:none; font-size:12px; flex:1; text-align:center;">
                🗺️ 高德
            </a>
            <a href="https://api.map.baidu.com/marker?location=${lat},${lng}&title=照片位置&output=html&coord_type=gcj02&zoom=15" 
               target="_blank" 
               style="background:#1a365d; color:white; padding:10px 15px; border-radius:15px; text-decoration:none; font-size:12px; flex:1; text-align:center;">
                🗺️ 百度
            </a>
            <a href="https://apis.map.qq.com/uri/v1/marker?marker=coord:${lat},${lng};title:照片位置" 
               target="_blank" 
               style="background:#1e3a5f; color:white; padding:10px 15px; border-radius:15px; text-decoration:none; font-size:12px; flex:1; text-align:center;">
                🗺️ 腾讯
            </a>
        </div>
    `;
}

async function fetchWithProxy(url) {
    const proxies = [
        `https://cors-anywhere.herokuapp.com/${url}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        `https://corsproxy.io/?${encodeURIComponent(url)}`
    ];
    for (const proxyUrl of proxies) {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);
            const response = await fetch(proxyUrl, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            if (response.ok) {
                const text = await response.text();
                return JSON.parse(text);
            }
        } catch (err) { continue; }
    }
    throw new Error('所有代理都失败');
}

// ========== 逆地理编码 ==========
async function reverseGeocodeWithProxy(lng, lat) {
    if (lng === null || lat === null || isNaN(lng) || isNaN(lat)) {
        geoAddressDisplay.innerHTML = '<span style="color:#fbbf24;">⏳ 未获取到GPS坐标</span>';
        return false;
    }
    if (!currentKey) {
        geoAddressDisplay.innerHTML = `
            <div class="success-box">
                ✅ <strong>检测到GPS坐标</strong><br><br>
                坐标: ${lng.toFixed(6)}, ${lat.toFixed(6)}<br>
                输入腾讯Key可解析详细地址
            </div>
            ${generateMapLinks(lat, lng)}
        `;
        geoStatusIcon.innerText = '📍 坐标就绪';
        return true;
    }
    geoAddressDisplay.innerHTML = '<span class="loading">🔍 解析地址中...</span>';
    try {
        const apiUrl = `https://apis.map.qq.com/ws/geocoder/v1/?location=${lat},${lng}&key=${currentKey}&get_poi=1`;
        const data = await fetchWithProxy(apiUrl);
        if (data.status === 0 && data.result) {
            const addr = data.result;
            const formattedAddress = addr.formatted_addresses?.recommend || addr.address;
            let html = `<div style="font-weight:600; margin-bottom:6px;">🏠 ${formattedAddress}</div>`;
            if (addr.address_component) {
                const c = addr.address_component;
                html += `<div style="font-size:11px; color:#9bb5d4;">${c.province || ''} ${c.city || ''} ${c.district || ''}<br>${c.street || ''} ${c.street_number || ''}</div>`;
            }
            html += `<div style="font-size:10px; margin-top:8px; color:#7e8cac;">📍 ${lng.toFixed(6)}, ${lat.toFixed(6)}</div>`;
            html += generateMapLinks(lat, lng);
            geoAddressDisplay.innerHTML = html;
            geoStatusIcon.innerText = '✅ 地址解析成功';
            return true;
        } else {
            throw new Error(data.message || '解析失败');
        }
    } catch (err) {
        geoAddressDisplay.innerHTML = `
            <div style="color:#f97316;">⚠️ 地址解析失败: ${err.message}</div>
            <div style="font-size:12px; color:#9ca3af;">坐标: ${lng.toFixed(6)}, ${lat.toFixed(6)}</div>
            ${generateMapLinks(lat, lng)}
        `;
        return false;
    }
}

function saveKey() {
    const key = tencentKeyInput.value.trim();
    if (!key) {
        localStorage.removeItem(STORAGE_KEY_TENCENT);
        currentKey = '';
        geoAddressDisplay.innerHTML = '<span style="color:#facc15;">🔑 Key已清空</span>';
        return;
    }
    localStorage.setItem(STORAGE_KEY_TENCENT, key);
    currentKey = key;
    geoStatusIcon.innerText = '✅ Key已保存';
    if (hasValidGpsCoord) {
        reverseGeocodeWithProxy(currentGcjLng, currentGcjLat);
    } else {
        geoAddressDisplay.innerHTML = '<span style="color:#6c86a3;">Key已保存，上传GPS照片后自动解析</span>';
    }
}
async function manualReverse() {
    if (!hasValidGpsCoord) {
        geoAddressDisplay.innerHTML = '<span style="color:#ffb347;">📡 当前照片无GPS坐标</span>';
        return;
    }
    await reverseGeocodeWithProxy(currentGcjLng, currentGcjLat);
}

function showBasic(file) {
    const w = (trueSize && trueSize.width)  ? trueSize.width  : previewImg.naturalWidth;
    const h = (trueSize && trueSize.height) ? trueSize.height : previewImg.naturalHeight;

    let modTime = '未知';
    const ts = file.lastModified;
    if (typeof ts === 'number' && isFinite(ts) && ts > 0) {
        const d = new Date(ts);

        if (!isNaN(d.getTime()) && d.getFullYear() >= 1980 && d.getFullYear() <= 2200) {
            modTime = d.toLocaleString();
        }
    }

    basicInfo.textContent =
`📛 文件名: ${file.name}
📦 大小: ${(file.size/1024/1024).toFixed(2)} MB
📐 尺寸: ${w}×${h}
🎞️ 类型: ${file.type || '未知'}
📅 最后修改: ${modTime}`;
}

function decodeExifBytes(bytes) {
    try {
        let arr = Array.from(bytes);
        if (arr.length >= 8) {
            const head = String.fromCharCode.apply(null, arr.slice(0, 8));
            if (/^(ASCII|UNICODE|JIS)/.test(head)) arr = arr.slice(8);
        }
        while (arr.length && arr[arr.length - 1] === 0) arr.pop();
        if (!arr.length) return null;

        const str = new TextDecoder('utf-8').decode(new Uint8Array(arr));
        const printable = str.replace(/[\x00-\x08\x0B-\x1F\uFFFD]/g, '');
        if (printable.length < str.length * 0.7) return null;
        if (printable.length < 3) return null;
        return str;
    } catch (e) {
        return null;
    }
}

function tryPrettyJSON(str) {
    if (typeof str !== 'string') return str;
    if (str.length < 60) return str;
    if (!/^\s*[\{\[]/.test(str)) return str;
    try {
        return JSON.stringify(JSON.parse(str), null, 2);
    } catch (e) {
        return str;
    }
}

function normalizeValue(key, raw) {
    if (raw === undefined || raw === null) return null;
    let value = raw;
    if (value && typeof value === 'object'
        && !(value instanceof Date)
        && !Array.isArray(value)
        && !ArrayBuffer.isView(value)
        && ('value' in value || 'description' in value)) {
        if (typeof value.description === 'string' && value.description.trim() !== '') {
            return value.description;
        }
        value = value.value;
        if (value === undefined || value === null) return null;
    }

    if (value instanceof Date) {
        const p = n => String(n).padStart(2, '0');
        return `${value.getFullYear()}-${p(value.getMonth()+1)}-${p(value.getDate())} ` +
               `${p(value.getHours())}:${p(value.getMinutes())}:${p(value.getSeconds())}`;
    }

    if (ArrayBuffer.isView(value) && !(value instanceof DataView)) {
        value = Array.from(value);
    }
    if (Array.isArray(value)) {
        const allBytes = value.length > 0 && value.every(v =>
            typeof v === 'number' && Number.isInteger(v) && v >= 0 && v <= 255
        );
        if (allBytes && /comment/i.test(key)) {
            const decoded = decodeExifBytes(value);
            if (decoded !== null) return tryPrettyJSON(decoded);
        }
        return value.join(', ');
    }
    if (typeof value === 'object') {
        const ks = Object.keys(value);
        if (ks.length > 0 && ks.every(k => /^\d+$/.test(k))) {
            return ks.sort((a, b) => +a - +b).map(k => value[k]).join(', ');
        }
        try {
            return JSON.stringify(value, null, 2);
        } catch (e) {
            return String(value);
        }
    }
    return tryPrettyJSON(String(value));
}

function toNumber(v) {
    if (typeof v === 'number') return v;
    if (Array.isArray(v)) return v[0] / (v[1] || 1);
    if (v && typeof v === 'object') {
        if (typeof v.value === 'number' && typeof v.denominator === 'number') {
            return v.value / (v.denominator || 1);
        }
        if (Array.isArray(v.value)) return v.value[0] / (v.value[1] || 1);
        if (typeof v.value === 'number') return v.value;
    }
    const n = parseFloat(v);
    return isNaN(n) ? NaN : n;
}

function convertGPS(gps, ref) {
    if (gps === null || gps === undefined) return NaN;
    if (typeof gps === 'number') return gps;
    if (!Array.isArray(gps)) return NaN;
    if (gps.length === 1 && typeof gps[0] === 'number') return gps[0];
    if (gps.length < 3) return NaN;

    const d = toNumber(gps[0]);
    const m = toNumber(gps[1]);
    const s = toNumber(gps[2]);
    if (isNaN(d) || isNaN(m) || isNaN(s)) return NaN;

    let val = d + m / 60 + s / 3600;
    if (ref === 'S' || ref === 'W') val = -Math.abs(val);
    return val;
}

function pickRef(raw) {
    if (!raw) return null;
    let v = raw;
    if (typeof v === 'object' && 'value' in v) v = v.value;
    const s = String(v).trim().charAt(0).toUpperCase();
    return (s === 'N' || s === 'S' || s === 'E' || s === 'W') ? s : null;
}

function extractGPS(data) {
    if (!data) return null;
    if (typeof data.latitude === 'number' && typeof data.longitude === 'number'
        && !isNaN(data.latitude) && !isNaN(data.longitude)
        && (data.latitude !== 0 || data.longitude !== 0)) {
        return { lat: data.latitude, lon: data.longitude };
    }

    let rawLat = data.GPSLatitude;
    let rawLon = data.GPSLongitude;

    if (rawLat && typeof rawLat === 'object' && 'value' in rawLat) rawLat = rawLat.value;
    if (rawLon && typeof rawLon === 'object' && 'value' in rawLon) rawLon = rawLon.value;

    if (rawLat === undefined || rawLat === null || rawLon === undefined || rawLon === null) {

        if (data.gps && typeof data.gps === 'object') {
            rawLat = data.gps.GPSLatitude ?? data.gps.latitude ?? data.gps.Latitude;
            rawLon = data.gps.GPSLongitude ?? data.gps.longitude ?? data.gps.Longitude;
            if (rawLat && typeof rawLat === 'object' && 'value' in rawLat) rawLat = rawLat.value;
            if (rawLon && typeof rawLon === 'object' && 'value' in rawLon) rawLon = rawLon.value;
        }
    }

    if (rawLat === undefined || rawLat === null || rawLon === undefined || rawLon === null) {
        return null;
    }

    const latRef = pickRef(data.GPSLatitudeRef) || pickRef(data.gps && data.gps.GPSLatitudeRef) || 'N';
    const lonRef = pickRef(data.GPSLongitudeRef) || pickRef(data.gps && data.gps.GPSLongitudeRef) || 'E';
    const lat = convertGPS(rawLat, latRef);
    const lon = convertGPS(rawLon, lonRef);
    if (isNaN(lat) || isNaN(lon)) return null;
    if (lat === 0 && lon === 0) return null;
    return { lat, lon };
}

function toDMS(dec, posSymbol, negSymbol) {
    if (isNaN(dec)) return '无效';
    const deg = Math.floor(Math.abs(dec));
    const min = Math.floor((Math.abs(dec) - deg) * 60);
    const sec = ((Math.abs(dec) - deg - min / 60) * 3600).toFixed(2);
    return `${dec >= 0 ? posSymbol : negSymbol} ${deg}°${min}′${sec}″`;
}

function inChina(lat, lon) {
    return lon > 73.66 && lon < 135.05 && lat > 3.86 && lat < 53.55;
}

function wgs84togcj02(lat, lon) {
    const pi = 3.14159265358979324;
    const a = 6378245.0;
    const ee = 0.00669342162296594323;
    let dLat = transformLat(lon - 105.0, lat - 35.0);
    let dLon = transformLon(lon - 105.0, lat - 35.0);
    let radLat = lat / 180.0 * pi;
    let magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    let sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * pi);
    dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * pi);
    return [lat + dLat, lon + dLon];
}

function transformLat(x, y) {
    const pi = 3.14159265358979324;
    return -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x))
           + (20*Math.sin(6*x*pi)+20*Math.sin(2*x*pi))*2/3
           + (20*Math.sin(y*pi)+40*Math.sin(y/3*pi))*2/3
           + (160*Math.sin(y/12*pi)+320*Math.sin(y/30*pi))*2/3;
}

function transformLon(x, y) {
    const pi = 3.14159265358979324;
    return 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x))
           + (20*Math.sin(6*x*pi)+20*Math.sin(2*x*pi))*2/3
           + (20*Math.sin(x*pi)+40*Math.sin(x/3*pi))*2/3
           + (150*Math.sin(x/12*pi)+300*Math.sin(x/30*pi))*2/3;
}
   
const KEY_ALIAS = {
    'isospeedratings': 'iso',
    'photographicsensitivity': 'iso',
    'isospeed': 'iso'
};

function canonicalKey(key) {
    const k = String(key).toLowerCase().replace(/[^a-z0-9]/g, '');
    return KEY_ALIAS[k] || k;
}

function looseNum(text) {
    if (typeof text === 'number') return text;
    if (typeof text !== 'string') return NaN;
    const t = text.trim();
    let m = t.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
    if (m) return parseFloat(m[1]) / parseFloat(m[2]);
    m = t.match(/^(-?\d+(?:\.\d+)?)\s*(?:mm|cm|m|s|sec|ms|dpi|px|%|"|')?\s*$/i);
    if (m) return parseFloat(m[1]);
    return NaN;
}

function normStr(s) {
    return String(s).trim().toLowerCase()
        .replace(/[:\s]+/g, '-')
        .replace(/[,\s]+/g, ' ');
}

function textEqual(a, b) {
    if (a === b) return true;
    const na = looseNum(a), nb = looseNum(b);
    if (!isNaN(na) && !isNaN(nb)) {
        const diff = Math.abs(na - nb);
        const scale = Math.max(Math.abs(na), Math.abs(nb), 1e-12);
        if (diff / scale <= 1e-4) return true;
    }
    return normStr(a) === normStr(b);
}

const GPS_SKIP = /^GPS/i;
const SKIP_KEYS = new Set([
    'MakerNote', 'thumbnail', 'Thumbnail', 'Photoshop',
    'latitude', 'longitude',
    'GPSInfo', 'ExifOffset', 'InteropOffset', 'InteropIndex',
    'ApplicationNotes', 'PrintIM'
]);

/**
 * 合并两个库的标签
 * @returns {Map} canonKey -> { key, items:[{text}] }
 */
function mergeTagSources(exifrTags, exifReaderTags) {
    const map = new Map();
    const sources = [
        { data: exifrTags },
        { data: exifReaderTags }
    ];

    for (const { data } of sources) {
        if (!data) continue;
        for (const key in data) {
            if (SKIP_KEYS.has(key) || GPS_SKIP.test(key)) continue;
            const raw = data[key];
            if (raw === undefined || raw === null) continue;

            const text = normalizeValue(key, raw);
            if (text === null || text === undefined) continue;
            if (typeof text === 'string' && text.trim() === '') continue;

            const ck = canonicalKey(key);
            let entry = map.get(ck);
            if (!entry) {
                entry = { key, items: [] };
                map.set(ck, entry);
            }

            let matched = false;
            for (const it of entry.items) {
                if (textEqual(it.text, text)) { matched = true; break; }
            }
            if (!matched) entry.items.push({ text });
        }
    }
    return map;
}

function extractSizeFromTags(exifrTags, exifReaderTags) {
    const wKeys = ['ExifImageWidth', 'PixelXDimension', 'ImageWidth'];
    const hKeys = ['ExifImageLength', 'ExifImageHeight', 'PixelYDimension', 'ImageHeight'];
    const getNum = v => {
        if (v == null) return NaN;
        if (typeof v === 'object' && 'value' in v) v = v.value;
        if (typeof v === 'object' && 'description' in v) v = v.description;
        const n = Number(String(v).replace(/[^\d.]/g, ''));
        return isNaN(n) ? NaN : n;
    };
    for (const src of [exifrTags, exifReaderTags]) {
        if (!src) continue;
        let w = NaN, h = NaN;
        for (const k of wKeys) { const n = getNum(src[k]); if (n > 0) { w = n; break; } }
        for (const k of hKeys) { const n = getNum(src[k]); if (n > 0) { h = n; break; } }
        if (w > 0 && h > 0) return { width: w, height: h };
    }
    return null;
}

const nameMap = {
    Make: '品牌', Model: '型号',
    DateTimeOriginal: '拍摄时间', CreateDate: '创建时间', ModifyDate: '修改时间',
    DateTimeDigitized: '数字化时间',
    FNumber: '光圈', ExposureTime: '快门', ISOSpeedRatings: 'ISO',
    PhotographicSensitivity: 'ISO', ISO: 'ISO',
    FocalLength: '焦距', Software: '软件', WhiteBalance: '白平衡',
    Flash: '闪光灯', Orientation: '方向', LensModel: '镜头', LensMake: '镜头厂商',
    ImageWidth: '图像宽度', ImageHeight: '图像高度',
    ExifImageWidth: '图片宽度', ExifImageLength: '图片高度', ExifImageHeight: '图片高度',
    PixelXDimension: '像素宽', PixelYDimension: '像素高',
    UserComment: '用户注释', ImageDescription: '图片描述',
    Artist: '作者', Copyright: '版权',
    DeviceSettingDescription: '设备设置描述',
    ExposureProgram: '曝光程序', ExposureBiasValue: '曝光补偿',
    MeteringMode: '测光模式', SceneCaptureType: '场景类型',
    ColorSpace: '色彩空间', ResolutionUnit: '分辨率单位',
    XResolution: '水平分辨率', YResolution: '垂直分辨率',
    FocalLengthIn35mmFilm: '等效焦距', DigitalZoomRatio: '数码变焦',
    SubjectDistance: '被摄距离', BrightnessValue: '亮度值',
    ShutterSpeedValue: '快门速度值', ApertureValue: '光圈值',
    GPSAltitude: '海拔', GPSAltitudeRef: '海拔基准'
};

async function parseEXIF(file) {
    console.log('开始EXIF解析（双库并行 + 合并去重）...');

    let exifrTags = null;
    let exifReaderTags = null;

    if (LIB_STATUS.EXIFR) {
        try {
            exifrTags = await exifr.parse(file, {
                tiff: true, ifd0: true, exif: true, gps: true, interop: true,
                iptc: true, xmp: true, icc: true, jfif: true,
                translateKeys: true, reviveValues: true, mergeOutput: true
            });
            console.log('✅ Exifr 标签数:', exifrTags ? Object.keys(exifrTags).length : 0);
        } catch (err) {
            console.warn('Exifr 失败:', err.message);
        }
    }

    if (LIB_STATUS.EXIFREADER) {
        try {
            exifReaderTags = await ExifReader.load(file);
            console.log('✅ ExifReader 标签数:', exifReaderTags ? Object.keys(exifReaderTags).length : 0);
        } catch (err) {
            console.warn('ExifReader 失败:', err.message);
        }
    }

    let gps = null;
    let gpsLib = null;
    if (exifrTags) {
        gps = extractGPS(exifrTags);
        if (gps) gpsLib = 'Exifr';
    }
    if (!gps && exifReaderTags) {
        gps = extractGPS(exifReaderTags);
        if (gps) gpsLib = 'ExifReader';
    }
    console.log('GPS 提取结果:', gps, '来源:', gpsLib);

    /* ---------- 合并去重 ---------- */
    const merged = mergeTagSources(exifrTags, exifReaderTags);

    const exifrCount  = exifrTags ? Object.keys(exifrTags).length : 0;
    const readerCount = exifReaderTags ? Object.keys(exifReaderTags).length : 0;

    if (merged.size === 0 && !gps) {
        exifInfo.textContent =
            '⚠️ 未找到EXIF数据或GPS信息\n\n可能原因:\n1. 照片不含EXIF信息\n2. 照片被压缩/编辑过\n3. 照片来自社交软件传输';
        geoStatusIcon.innerText = '📡 无EXIF数据';
        geoAddressDisplay.innerHTML = '<span style="color:#6c86a3;">未检测到EXIF元数据</span>';
        return;
    }

    let text = '';
    text += `📡 Exifr:      ${exifrTags ? `✅ ${exifrCount} 项` : '❌ 解析失败/未加载'}\n`;
    text += `📡 ExifReader: ${exifReaderTags ? `✅ ${readerCount} 项` : '❌ 解析失败/未加载'}\n`;
    text += `🧮 合并去重后: ${merged.size} 个字段`;
    if (gpsLib) text += `　|　GPS 来源: ${gpsLib}`;
    text += '\n';
    text += '─'.repeat(34) + '\n\n';

    let printedAny = false;
    for (const [, entry] of merged) {
        const cn = nameMap[entry.key] || entry.key;
        const values = entry.items.map(it => it.text);

        if (values.length === 1) {
            const str = values[0];
            if (str.includes('\n') || str.length > 80) {
                text += `${cn}:\n${str}\n\n`;
            } else {
                text += `${cn}: ${str}\n`;
            }
        } else {

            text += `${cn}:\n`;
            for (const str of values) {
                if (str.includes('\n') || str.length > 80) {
                    text += `${str}\n\n`;
                } else {
                    text += `  ${str}\n`;
                }
            }
            text += '\n';
        }
        printedAny = true;
    }
    if (!printedAny) text += '（没有可显示的标签字段）\n';

    /* ---------- GPS 坐标 ---------- */
    let hasGPS = false;
    if (gps && !isNaN(gps.lat) && !isNaN(gps.lon)) {
        hasGPS = true;
        const wgsLat = gps.lat;
        const wgsLon = gps.lon;
        const isChinaArea = inChina(wgsLat, wgsLon);

        let latFinal = wgsLat, lonFinal = wgsLon;
        if (isChinaArea) {
            const [gcjLat, gcjLon] = wgs84togcj02(wgsLat, wgsLon);
            latFinal = gcjLat;
            lonFinal = gcjLon;
            text += `\n🔁 坐标已从 WGS84 转换为 GCJ02（适配国内地图）\n`;
        }

        text += `\n📍 纬度: ${toDMS(latFinal, 'N', 'S')}\n`;
        text += `📍 经度: ${toDMS(lonFinal, 'E', 'W')}\n`;
        text += `📍 十进制: ${lonFinal.toFixed(6)}, ${latFinal.toFixed(6)}\n`;
        if (gpsLib) text += `📍 GPS来源: ${gpsLib}\n`;

        currentGcjLat = latFinal;
        currentGcjLng = lonFinal;
        hasValidGpsCoord = true;
        coordDebugSpan.innerHTML = `📍 ${lonFinal.toFixed(6)}, ${latFinal.toFixed(6)}`;

        geoAddressDisplay.innerHTML = `
            <div class="success-box">
                ✅ <strong>GPS坐标</strong><br><br>
                坐标: ${lonFinal.toFixed(6)}, ${latFinal.toFixed(6)}
            </div>
            ${generateMapLinks(latFinal, lonFinal)}
        `;
        geoStatusIcon.innerText = '📍 坐标就绪';

        if (currentKey) {
            setTimeout(() => reverseGeocodeWithProxy(currentGcjLng, currentGcjLat), 500);
        }
    }

    if (!hasGPS) {
        text += `\n⚠️ 未检测到有效的 GPS 坐标信息\n`;
        geoStatusIcon.innerText = '📡 无GPS坐标';
        geoAddressDisplay.innerHTML = '<span style="color:#6c86a3;">🖼️ 当前照片无 GPS 坐标</span>';
        coordDebugSpan.innerHTML = '无坐标数据';
        hasValidGpsCoord = false;
    }

    /* ---------- 尺寸兜底 ---------- */
    if (!trueSize || !trueSize.width) {
        const sz = extractSizeFromTags(exifrTags, exifReaderTags);
        if (sz) {
            trueSize = sz;
            showBasic(currentFile);
        }
    }

    exifInfo.textContent = text;
}

function resetUIForNewImage() {
    exifInfo.textContent = '解析中...';
    basicInfo.textContent = '加载中...';
    currentGcjLng = null;
    currentGcjLat = null;
    hasValidGpsCoord = false;
    trueSize = null;
    geoAddressDisplay.innerHTML = '<span style="color:#6c86a3;">🔄 解析中...</span>';
    geoStatusIcon.innerText = '🌐 等待';
    coordDebugSpan.innerHTML = '';
}

async function handleFile(file) {
    if (!file) return;
    if (!LIB_STATUS.EXIFR && !LIB_STATUS.EXIFREADER) {
        exifInfo.textContent = '❌ 未加载EXIF解析库，请刷新页面重试';
        return;
    }
    resetUIForNewImage();
    currentFile = file;

    const heic = await isHeicFile(file);
    let previewBlob = file;

    if (heic) {
        if (typeof heic2any === 'undefined') {
            basicInfo.textContent = '❌ HEIC 解码库未加载，请刷新页面重试';
            await parseEXIF(file);
            return;
        }
        basicInfo.textContent = '🔄 HEIC 转换中...';
        try {
            const converted = await heic2any({
                blob: file,
                toType: 'image/jpeg',
                quality: 0.92
            });
            previewBlob = Array.isArray(converted) ? converted[0] : converted;
        } catch (err) {
            console.error('HEIC 转换失败:', err);
            basicInfo.textContent = '❌ HEIC 转换失败：' + (err && err.message ? err.message : err);
            await parseEXIF(file);
            return;
        }
    }

    if (heic) {
        trueSize = await getHeicTrueSize(file);
        if (!trueSize) {
            trueSize = await getTrueImageSize(previewBlob);
        }
    } else {
        trueSize = await getTrueImageSize(previewBlob);
    }

    const url = URL.createObjectURL(previewBlob);
    previewImg.src = url;
    previewImg.onload = async () => {
        canvas.width = previewImg.naturalWidth;
        canvas.height = previewImg.naturalHeight;
        ctx.drawImage(previewImg, 0, 0);
        showBasic(file);
        await parseEXIF(file);
        URL.revokeObjectURL(url);
    };
    previewImg.onerror = () => {
        basicInfo.textContent = '图片加载失败';
        parseEXIF(file);
    };
}

uploadBox.onclick = () => fileInput.click();

uploadBox.addEventListener('dragover', e => {
    e.preventDefault();
    uploadBox.style.borderColor = '#3b82f6';
});

uploadBox.addEventListener('dragleave', () => {
    uploadBox.style.borderColor = '#4a5568';
});

uploadBox.addEventListener('drop', e => {
    e.preventDefault();
    uploadBox.style.borderColor = '#4a5568';
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleFile(file);
    else alert('请选择图片文件');
});

fileInput.onchange = () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
};

    updateLibStatus();
    const savedKey = localStorage.getItem(STORAGE_KEY_TENCENT);
    if (savedKey) {
        tencentKeyInput.value = savedKey;
        currentKey = savedKey;
    }
    saveKeyBtn.addEventListener('click', saveKey);
    manualReverseBtn.addEventListener('click', manualReverse);
});
