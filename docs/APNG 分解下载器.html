<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APNG 分解下载器</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px;min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:#0f1115;color:#e6e9ef;
  }
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:#8b93a7;font-size:13px;margin:0 0 22px}

  .drop{
    border:2px dashed #2b3140;border-radius:14px;padding:44px 20px;text-align:center;
    cursor:pointer;transition:.18s;background:#141821;
  }
  .drop:hover,.drop.over{border-color:#4f8cff;background:#161c2b}
  .drop p{margin:6px 0;color:#c3cad9}
  .drop .hint{font-size:12px;color:#6e7789}
  .drop .big{font-size:34px;line-height:1}

  .hidden{display:none!important}

  .info{background:#141821;border:1px solid #232936;border-radius:12px;padding:16px;margin-top:18px}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .info-grid div{display:flex;flex-direction:column;gap:4px}
  .info-grid span{font-size:12px;color:#7d8698}
  .info-grid b{font-size:14px;font-weight:600;word-break:break-all}

  .actions{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    margin-top:16px;padding:14px 16px;background:#141821;
    border:1px solid #232936;border-radius:12px;
  }
  .actions .count{font-size:13px;color:#8b93a7;margin-right:auto}
  button{
    font:inherit;font-size:13px;padding:9px 18px;border-radius:9px;
    border:1px solid #2f3646;background:#1c2230;color:#e6e9ef;cursor:pointer;transition:.15s;
  }
  button:hover{background:#242c3d;border-color:#3d4761}
  button:disabled{opacity:.5;cursor:default}
  button.primary{background:#3b6fd4;border-color:#3b6fd4}
  button.primary:hover:not(:disabled){background:#4a80e8}
  button.ghost{color:#8fc6ff;border-color:#26406b;background:#16223a}
  button.ghost:hover{background:#1c2c4a;border-color:#33538a}

  /* ---- 文件卡片 ---- */
  .file-card{
    margin-top:20px;background:#11151d;border:1px solid #232936;
    border-radius:14px;padding:16px;
  }
  .file-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .file-head h2{
    font-size:15px;margin:0;flex:1 1 220px;min-width:0;

  }
  .tag{
    font-size:12px;color:#8b93a7;background:#1a1f2b;border:1px solid #262d3d;

  .file-head .remove{padding:6px 12px;font-size:12px;line-height:1;border-radius:8px;color:#98a1b3}
  .file-head .remove:hover{color:#ff9d9d;border-color:#5a2a2a;background:#2a1a1a}

  /* ---- 默认图区域 ---- */
  .default-img{
    margin-top:14px;background:#141821;border:1px solid #2c3548;

  }
  .default-img .di-thumb{

    background-image:

  .default-img .dl-default{padding:7px 14px;font-size:12px;flex:0 0 auto}

  .file-card .frames{margin-top:16px}

    background:#141821;border:1px solid #232936;border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .thumb{
    height:130px;display:flex;align-items:center;justify-content:center;padding:10px;
    background-image:
      linear-gradient(45deg,#1b202b 25%,transparent 25%),

      linear-gradient(45deg,transparent 75%,#1b202b 75%),
      linear-gradient(-45deg,transparent 75%,#1b202b 75%);

    background-position:0 0,0 8px,8px -8px,-8px 0;
    background-color:#151a23;
  }
  .thumb img{max-width:100%;max-height:110px;image-rendering:pixelated;display:block;cursor:zoom-in}
  .thumb img:focus{outline:2px solid #4f8cff;outline-offset:2px;border-radius:4px}
  .meta{padding:10px 12px;font-size:12px;color:#98a1b3;display:flex;flex-direction:column;gap:3px}
  .meta .idx{color:#e6e9ef;font-weight:600;font-size:13px;margin-bottom:2px}
  .frame .dl{margin:0 10px 10px;padding:7px;font-size:12px;text-align:center}

  /* ---- 大图预览 ---- */
  .lightbox{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;

    position:relative;border-radius:12px;overflow:hidden;
    border:1px solid #2b3140;
    box-shadow:0 24px 70px rgba(0,0,0,.65);
    background-color:#151a23;
    background-image:
      linear-gradient(45deg,#1b202b 25%,transparent 25%),
      linear-gradient(-45deg,#1b202b 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#1b202b 75%),
      linear-gradient(-45deg,transparent 75%,#1b202b 75%);

    background-position:0 0,0 10px,10px -10px,-10px 0;

    display:block;max-width:88vw;max-height:76vh;
    image-rendering:pixelated;
  }
  .lb-info{
    position:absolute;left:0;right:0;bottom:0;
    padding:24px 14px 10px;font-size:12px;color:#cdd5e3;
    background:linear-gradient(transparent,rgba(8,10,14,.88));
    text-align:center;word-break:break-all;pointer-events:none;
  }

    position:absolute;z-index:2;display:flex;align-items:center;justify-content:center;
    width:42px;height:42px;padding:0;border-radius:50%;font-size:18px;line-height:1;
    border:1px solid #2f3646;background:rgba(28,34,48,.9);color:#e6e9ef;cursor:pointer;
    transition:.15s;
  }
  .lb-btn:hover{background:#2c3548;border-color:#3d4761}
  .lb-close{top:18px;right:18px}
  .lb-prev{left:18px;top:50%;transform:translateY(-50%)}
  .lb-next{right:18px;top:50%;transform:translateY(-50%)}
  @media (max-width:600px){
    .lb-stage img{max-width:94vw;max-height:70vh}
    .lb-btn{width:36px;height:36px;font-size:16px}
    .lb-prev{left:6px}
    .lb-next{right:6px}
  }
</style>

<body>
<div class="wrap">
  <h1>APNG 分解下载器</h1>
  <p class="sub">把 APNG 动画拆成独立的 PNG 帧，可点击小图预览</p>

  <div class="drop" id="drop">
    <input type="file" id="file" accept="image/png,image/apng,.png,.apng" multiple hidden>
    <p class="big">🖼️</p>
    <p>点击选择，或把 APNG 文件拖到这里（可多选）</p>
    <p class="hint">支持 .png / .apng，可一次选中多个文件</p>
  </div>
  <div class="actions hidden" id="globalBar">
    <span class="count" id="globalCount"></span>
    <button id="btnToggleDefault" class="ghost">隐藏默认图</button>
    <button class="primary" id="btnZipAll">全部打包 ZIP</button>
    <button id="btnClear">清空全部</button>
  </div>
  <div id="list"></div>
</div>

<!-- 大图预览层 -->
<div class="lightbox" id="lightbox">
  <div class="lb-stage">
    <img id="lbImg" alt="">
    <div class="lb-info" id="lbInfo"></div>
  </div>
  <button class="lb-btn lb-close" id="lbClose" title="关闭（Esc）">✕</button>
  <button class="lb-btn lb-prev" id="lbPrev" title="上一帧（←）">‹</button>
  <button class="lb-btn lb-next" id="lbNext" title="下一帧（→）">›</button>
</div>

<script>
 
const PNG_SIG = new Uint8Array([0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A]);
const EMPTY = new Uint8Array(0);

const u16 = (d,o) => (d[o] << 8) | d[o+1];
const u32 = (d,o) => ((d[o] << 24) | (d[o+1] << 16) | (d[o+2] << 8) | d[o+3]) >>> 0;

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(data) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) c = CRC_TABLE[(c ^ data[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function concatBytes(list) {
  let total = 0;
  for (const b of list) total += b.length;
  const out = new Uint8Array(total);
  let off = 0;
  for (const b of list) { out.set(b, off); off += b.length; }
  return out;
}
function makeChunk(type, data) {
  const len = data.length;
  const buf = new Uint8Array(12 + len);
  const dv = new DataView(buf.buffer);
  dv.setUint32(0, len);
  buf[4] = type.charCodeAt(0);
  buf[5] = type.charCodeAt(1);
  buf[6] = type.charCodeAt(2);
  buf[7] = type.charCodeAt(3);
  buf.set(data, 8);
  dv.setUint32(8 + len, crc32(buf.subarray(4, 8 + len)));
  return buf;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
const pad3 = n => String(n).padStart(3, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frameName = (item, i) => `${item.baseName}_frame_${pad3(i)}.png`;

function parseChunks(bytes) {
  for (let i = 0; i < 8; i++) {
    if (bytes[i] !== PNG_SIG[i]) throw new Error('不是有效的 PNG 文件');
  }
  const chunks = [];
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let off = 8;
  while (off + 8 <= bytes.length) {
    const len = dv.getUint32(off);
    const type = String.fromCharCode(bytes[off+4], bytes[off+5], bytes[off+6], bytes[off+7]);
    if (off + 12 + len > bytes.length) throw new Error('文件数据不完整或已损坏');
    chunks.push({ type, data: bytes.subarray(off + 8, off + 8 + len) });
    off += 12 + len;
    if (type === 'IEND') break;
  }
  return chunks;
}

function parseFcTL(d) {
  return {
    seq: u32(d, 0),
    width: u32(d, 4),
    height: u32(d, 8),
    x: u32(d, 12),
    y: u32(d, 16),
    delayNum: u16(d, 20),
    delayDen: u16(d, 22),
    dispose: d[24],
    blend: d[25]
  };
}

function parseAPNG(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const chunks = parseChunks(bytes);

  const ihdrChunk = chunks.find(c => c.type === 'IHDR');
  if (!ihdrChunk) throw new Error('缺少 IHDR 块，不是有效的 PNG');
  const ihdr = ihdrChunk.data;
  const width  = u32(ihdr, 0);
  const height = u32(ihdr, 4);

  const acTL = chunks.find(c => c.type === 'acTL');
  if (!acTL) throw new Error('这不是 APNG（没有找到 acTL 动画控制块）');

  const numFrames = u32(acTL.data, 0);
  const numPlays  = u32(acTL.data, 4);

  const AUX_ORDER = ['cHRM','gAMA','iCCP','sBIT','sRGB','PLTE','tRNS','hIST','bKGD','pHYs'];
  const aux = [];
  for (const type of AUX_ORDER) {
    for (const c of chunks) {
      if (c.type === type) aux.push([type, c.data]);
    }
  }

  const firstFctl = chunks.findIndex(c => c.type === 'fcTL');
  const firstIdat = chunks.findIndex(c => c.type === 'IDAT');
  const idatInFrame0 = firstFctl !== -1 && firstIdat !== -1 && firstIdat > firstFctl;

  let defaultIdat = null;
  if (!idatInFrame0) {
    const idatChunks = chunks.filter(c => c.type === 'IDAT');
    if (idatChunks.length) {
      defaultIdat = concatBytes(idatChunks.map(c => c.data));
    }
  }

  const frames = [];
  let cur = null;
  for (const c of chunks) {
    if (c.type === 'fcTL') {
      cur = { fctl: parseFcTL(c.data), parts: [] };
      frames.push(cur);
    } else if (c.type === 'IDAT') {
      if (idatInFrame0 && frames.length === 1) frames[0].parts.push(c.data);
    } else if (c.type === 'fdAT') {
      if (cur) cur.parts.push(c.data.subarray(4)); 
    }
  }

  if (frames.length === 0) throw new Error('没有解析到任何动画帧');

  return { width, height, numFrames, numPlays, ihdr, aux, frames, defaultIdat };
}

function buildStaticPNG(ihdr, aux, idat) {
  const parts = [PNG_SIG, makeChunk('IHDR', ihdr)];
  for (const [type, data] of aux) parts.push(makeChunk(type, data));
  const MAX = 65536;
  for (let i = 0; i < idat.length; i += MAX) {
    parts.push(makeChunk('IDAT', idat.subarray(i, Math.min(i + MAX, idat.length))));
  }
  parts.push(makeChunk('IEND', EMPTY));
  return concatBytes(parts);
}

function buildFramePNG(frame, ihdr, aux) {
  const w = frame.fctl.width;
  const h = frame.fctl.height;

  const newIhdr = new Uint8Array(13);
  const dv = new DataView(newIhdr.buffer);
  dv.setUint32(0, w);
  dv.setUint32(4, h);
  newIhdr[8]  = ihdr[8];   // bit depth
  newIhdr[9]  = ihdr[9];   // color type
  newIhdr[10] = ihdr[10];  // compression
  newIhdr[11] = ihdr[11];  // filter
  newIhdr[12] = ihdr[12];  // interlace

  const idat = concatBytes(frame.parts);
  return buildStaticPNG(newIhdr, aux, idat);
}

function buildZip(files) {
  const enc = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const size = data.length;

    // 本地文件头
    const local = new Uint8Array(30 + nameBytes.length);
    const ldv = new DataView(local.buffer);
    ldv.setUint32(0, 0x04034b50, true);
    ldv.setUint16(4, 20, true);
    ldv.setUint16(6, 0x0800, true);   // UTF-8 文件名
    ldv.setUint16(8, 0, true);        // 存储方式
    ldv.setUint16(10, 0, true);
    ldv.setUint16(12, 0x2821, true);
    ldv.setUint32(14, crc, true);
    ldv.setUint32(18, size, true);
    ldv.setUint32(22, size, true);
    ldv.setUint16(26, nameBytes.length, true);
    ldv.setUint16(28, 0, true);
    local.set(nameBytes, 30);

    localParts.push(local, data);

    // 中央目录项
    const cen = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(cen.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0x0800, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0x2821, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    cen.set(nameBytes, 46);

    centralParts.push(cen);
    offset += local.length + size;
  }

  const centralSize = centralParts.reduce((a, b) => a + b.length, 0);

  const end = new Uint8Array(22);
  const edv = new DataView(end.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, offset, true);
  edv.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, end], { type: 'application/zip' });
}

function loadImage(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('帧图像加载失败')); };
    img.src = url;
  });
}

async function compositeFrames(state) {
  const cw = state.width, ch = state.height;
  const canvas = document.createElement('canvas');
  canvas.width = cw;
  canvas.height = ch;
  const ctx = canvas.getContext('2d');

  const out = [];
  let snapshot = null;      // dispose=PREVIOUS 用的快照
  let prevDispose = -1;
  let prevRect = null;

  for (let i = 0; i < state.frames.length; i++) {
    const f = state.frames[i].fctl;

    if (prevRect) {
      if (prevDispose === 1) {
        ctx.clearRect(prevRect.x, prevRect.y, prevRect.w, prevRect.h);
      } else if (prevDispose === 2 && snapshot) {
        ctx.putImageData(snapshot, 0, 0);
      }
    }
    if (f.dispose === 2) snapshot = ctx.getImageData(0, 0, cw, ch);
    const img = await loadImage(state.frames[i].blob);
    ctx.save();
    ctx.beginPath();
    ctx.rect(f.x, f.y, f.width, f.height);
    ctx.clip();
    ctx.globalCompositeOperation = (f.blend === 1) ? 'source-over' : 'copy';
    ctx.drawImage(img, f.x, f.y, f.width, f.height);
    ctx.restore();

    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    out.push(blob);
    prevDispose = f.dispose;
    prevRect = { x: f.x, y: f.y, w: f.width, h: f.height };
  }
  return out;
}
function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
}
const items = [];          
let uid = 0;
let showDefaults = false;   
const dropEl      = document.getElementById('drop');
const fileEl      = document.getElementById('file');
const listEl      = document.getElementById('list');
const globalBar   = document.getElementById('globalBar');
const globalCount = document.getElementById('globalCount');
const btnZipAll   = document.getElementById('btnZipAll');
const btnClear    = document.getElementById('btnClear');
const btnToggleDefault = document.getElementById('btnToggleDefault');

const DISPOSE_NAME = { 0: 'NONE', 1: 'BACKGROUND', 2: 'PREVIOUS' };
const BLEND_NAME   = { 0: 'SOURCE', 1: 'OVER' };
 
dropEl.addEventListener('click', () => fileEl.click());

fileEl.addEventListener('change', e => {
  handleFiles(e.target.files);
  fileEl.value = '';   // 允许重复选择同一个文件
});

['dragenter', 'dragover'].forEach(ev =>
  dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev =>
  dropEl.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.remove('over'); }));

dropEl.addEventListener('drop', e => {
  if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

// —— 全局“隐藏/显示默认图”按钮 ——
btnToggleDefault.addEventListener('click', () => {
  showDefaults = !showDefaults;
  document.querySelectorAll('.default-img').forEach(el => {
    el.classList.toggle('hidden', !showDefaults);
  });
  btnToggleDefault.textContent = showDefaults ? '隐藏默认图' : '显示默认图';

  // 若正在大图预览，同步刷新预览列表（默认图隐藏时从序列中移除）
  if (lbCtx) {
    const cur = lbCtx.list[lbCtx.pos];
    const list = buildGlobalFrameList();
    let pos = -1;
    if (cur.isDefault) {
      // 之前在看默认图：显示时保留，隐藏时跳到该文件的第一帧
      pos = showDefaults
        ? list.findIndex(e => e.item === cur.item && e.index === -1)
        : list.findIndex(e => e.item === cur.item && e.index === 0);
    } else {
      pos = list.findIndex(e => e.item === cur.item && e.index === cur.index);
    }
    if (pos === -1) { closeLightbox(); return; }
    lbCtx = { list, pos };
    renderLightbox();
  }
});

const lbEl    = document.getElementById('lightbox');
const lbImg   = document.getElementById('lbImg');
const lbInfo  = document.getElementById('lbInfo');
const lbClose = document.getElementById('lbClose');
const lbPrev  = document.getElementById('lbPrev');
const lbNext  = document.getElementById('lbNext');

let lbCtx = null;   // { list: [{item, index, isDefault}...], pos }

function buildGlobalFrameList() {
  const list = [];
  for (const it of items) {
    // 只有默认图处于“显示”状态时才加入预览序列
    if (it.defaultUrl && showDefaults) list.push({ item: it, index: -1, isDefault: true });
    for (let i = 0; i < it.frames.length; i++) list.push({ item: it, index: i, isDefault: false });
  }
  return list;
}

function openLightbox(item, index) {
  const list = buildGlobalFrameList();
  let pos = list.findIndex(e => e.item === item && e.index === index);
  if (pos === -1) {
    // 请求的是被隐藏的默认图 → 退回到该文件第一帧
    pos = list.findIndex(e => e.item === item && e.index === 0);
  }
  if (pos === -1) return;

  lbCtx = { list, pos };
  renderLightbox();
  lbEl.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  if (!lbCtx) return;
  lbCtx = null;
  lbEl.classList.remove('show');
  document.body.style.overflow = '';
}

function stepLightbox(delta) {
  if (!lbCtx) return;
  const n = lbCtx.list.length;
  if (n < 2) return;
  lbCtx.pos = (lbCtx.pos + delta + n) % n;
  renderLightbox();
}

function renderLightbox() {
  const { list, pos } = lbCtx;
  const entry = list[pos];
  const { item, index, isDefault } = entry;

  if (isDefault) {
    lbImg.src = item.defaultUrl;
    lbImg.alt = `${item.fileName} 默认图`;
    lbInfo.textContent =
      `${item.fileName} · 默认图（IDAT 静态图） · ` +
      `${item.width}×${item.height} · 不在动画序列中`;
  } else {
    const f = item.frames[index];
    const c = f.fctl;
    const den = c.delayDen || 100;
    lbImg.src = f.url;
    lbImg.alt = `${item.fileName} 第 ${index + 1} 帧`;
    lbInfo.textContent =
      `${item.fileName} · 第 ${index + 1}/${item.frames.length} 帧 · ` +
      `全局 ${pos + 1}/${list.length} · ` +
      `${c.width}×${c.height} · 偏移 (${c.x}, ${c.y}) · ` +
      `延迟 ${(c.delayNum / den * 1000).toFixed(0)} ms`;
  }

  const multi = list.length > 1;
  lbPrev.classList.toggle('hidden', !multi);
  lbNext.classList.toggle('hidden', !multi);
}

lbClose.addEventListener('click', closeLightbox);
lbPrev.addEventListener('click', () => stepLightbox(-1));
lbNext.addEventListener('click', () => stepLightbox(1));

// 点击遮罩（图片外的区域）关闭
lbEl.addEventListener('click', e => {
  if (e.target === lbEl) closeLightbox();
});

document.addEventListener('keydown', e => {
  if (!lbCtx) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft')  { e.preventDefault(); stepLightbox(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepLightbox(1); }
});

async function handleFiles(fileList) {
  const arr = Array.from(fileList || []);
  if (!arr.length) return;
  let ok = 0;
  const failed = [];
  for (const file of arr) {
    try {
      const item = await buildItem(file);
      items.push(item);
      renderItem(item);
      ok++;
    } catch (err) {
      console.error(err);
      failed.push(file.name);
    }
  }
  updateGlobal();
  if (failed.length && !ok) alert('解析失败：' + failed.join('、'));
}

async function buildItem(file) {
  const buf = await file.arrayBuffer();
  const state = parseAPNG(buf);

  const kept = state.frames.filter(f => !(f.fctl.width === 1 && f.fctl.height === 1));
  if (kept.length) {
    state.tinyDropped = state.frames.length - kept.length;
    state.frames = kept;
  } else {
    state.tinyDropped = 0;
  }
  state.id       = ++uid;
  state.fileName = file.name;
  state.baseName = file.name.replace(/\.(png|apng)$/i, '') || 'frame';
  state.compositeCache = null;

  state.frames.forEach(f => {
    f.bytes = buildFramePNG(f, state.ihdr, state.aux);
    f.blob  = new Blob([f.bytes], { type: 'image/png' });
    f.url   = URL.createObjectURL(f.blob);
  });

  if (state.defaultIdat) {
    const defaultBytes = buildStaticPNG(state.ihdr, state.aux, state.defaultIdat);
    state.defaultBlob = new Blob([defaultBytes], { type: 'image/png' });
    state.defaultUrl  = URL.createObjectURL(state.defaultBlob);
  } else {
    state.defaultBlob = null;
    state.defaultUrl  = null;
  }

  return state;
}   
function renderItem(item) {
  const card = document.createElement('section');
  card.className = 'file-card';

  const sourceCount = item.frames.length + (item.tinyDropped || 0);
  const declared = item.numFrames !== sourceCount ? `（声明 ${item.numFrames}）` : '';
  const tinyTag = item.tinyDropped
    ? `<span class="tag tiny">已忽略 ${item.tinyDropped} 个 1×1 帧</span>`
    : '';
  const defTag = item.defaultUrl
    ? `<span class="tag def">含默认图</span>`
    : '';

  const head = document.createElement('div');
  head.className = 'file-head';
  head.innerHTML =
    `<h2 title="${esc(item.fileName)}">${esc(item.fileName)}</h2>` +
    `<span class="tag">${item.width} × ${item.height}</span>` +
    `<span class="tag">${item.frames.length} 帧${declared}</span>` +
    tinyTag + defTag +
    `<button class="remove" title="移除该文件">✕ 移除</button>`;

  // —— 默认图区域 ——
  let defaultBox = null;
  if (item.defaultUrl) {
    defaultBox = document.createElement('div');
    defaultBox.className = 'default-img';
    if (!showDefaults) defaultBox.classList.add('hidden');
    defaultBox.innerHTML =
      `<div class="di-thumb" tabindex="0" title="点击查看大图">` +
        `<img src="${item.defaultUrl}" alt="默认图">` +
      `</div>` +
      `<div class="di-info">` +
        `<div class="t">🖼️ 默认图（IDAT 静态图，不在动画序列中）</div>` +
        `<div>在支持 APNG 的软件里，这张图会被动画覆盖；在不支持 APNG 的软件（或部分聊天工具的缩略图/点开预览）里，它作为普通 PNG 显示。这就是为什么同一文件在不同地方看起来内容不一样。</div>` +
      `</div>` +
      `<button class="dl-default">导出默认图</button>`;
  }

  const bar = document.createElement('div');
  bar.className = 'actions';
  bar.innerHTML =
    `<button class="primary zip">打包下载 ZIP</button>` +
    `<button class="each">逐个下载</button>`;

  const grid = document.createElement('div');
  grid.className = 'frames';
  grid.innerHTML = item.frames.map((f, i) => {
    const c = f.fctl;
    const den = c.delayDen || 100;
    const delayMs = (c.delayNum / den * 1000);
    return `
      <div class="frame">
        <div class="thumb"><img src="${f.url}" data-i="${i}" alt="第 ${i} 帧，点击查看大图" loading="lazy"></div>
        <div class="meta">
          <div class="idx">#${i}（序号 ${c.seq}）</div>
          <div>尺寸：${c.width} × ${c.height}</div>
          <div>偏移：(${c.x}, ${c.y})</div>
          <div>延迟：${delayMs.toFixed(0)} ms（${c.delayNum}/${c.delayDen || 100}）</div>
          <div>dispose：${DISPOSE_NAME[c.dispose] ?? c.dispose}</div>
          <div>blend：${BLEND_NAME[c.blend] ?? c.blend}</div>
        </div>
        <button class="dl" data-i="${i}">下载此帧</button>
      </div>
    `;
  }).join('');

  if (defaultBox) card.append(head, defaultBox, bar, grid);
  else card.append(head, bar, grid);

  listEl.appendChild(card);

  item.el = {
    card,
    zip:  bar.querySelector('.zip'),
    each: bar.querySelector('.each')
  };

  head.querySelector('.remove').addEventListener('click', () => removeItem(item));
  item.el.zip.addEventListener('click', () => downloadZip(item));
  item.el.each.addEventListener('click', () => downloadEach(item));
  // 默认图事件
  if (defaultBox) {
    const thumb = defaultBox.querySelector('.di-thumb');
    const btn   = defaultBox.querySelector('.dl-default');
    const openDef = () => openLightbox(item, -1);
    thumb.addEventListener('click', openDef);
    thumb.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDef(); }
    });
    btn.addEventListener('click', () => {
      saveBlob(item.defaultBlob, `${item.baseName}_default.png`);
    });
  }

  grid.querySelectorAll('button.dl').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.i;
      saveBlob(item.frames[i].blob, frameName(item, i));
    });
  });
  // 点击小图 → 查看大图
  grid.querySelectorAll('.thumb img').forEach(img => {
    const i = +img.dataset.i;
    img.tabIndex = 0;
    img.addEventListener('click', () => openLightbox(item, i));
    img.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openLightbox(item, i);
      }
    });
  });
}   
function removeItem(item) {
  const idx = items.indexOf(item);
  if (idx === -1) return;
  if (lbCtx && lbCtx.list.some(e => e.item === item)) closeLightbox();   
  items.splice(idx, 1);
  item.frames.forEach(f => URL.revokeObjectURL(f.url));
  if (item.defaultUrl) URL.revokeObjectURL(item.defaultUrl);
  item.el.card.remove();
  updateGlobal();
}
btnClear.addEventListener('click', () => {
  if (!items.length) return;
  if (!confirm(`确定清空全部 ${items.length} 个文件吗？`)) return;
  closeLightbox();
  items.forEach(item => {
    item.frames.forEach(f => URL.revokeObjectURL(f.url));
    if (item.defaultUrl) URL.revokeObjectURL(item.defaultUrl);
  });
  items.length = 0;
  listEl.innerHTML = '';
  updateGlobal();
});
function updateGlobal() {
  const n = items.length;
  globalBar.classList.toggle('hidden', n === 0);
  if (!n) return;
  const total = items.reduce((a, b) => a + b.frames.length, 0);
  const tiny  = items.reduce((a, b) => a + (b.tinyDropped || 0), 0);
  const defs  = items.reduce((a, b) => a + (b.defaultUrl ? 1 : 0), 0);
  let txt = `已加载 ${n} 个文件，共 ${total} 帧`;
  if (tiny) txt += `（已忽略 ${tiny} 个 1×1 帧）`;
  if (defs) txt += `（含 ${defs} 张默认图）`;
  globalCount.textContent = txt;
  btnToggleDefault.classList.toggle('hidden', defs === 0);
  btnToggleDefault.textContent = showDefaults ? '隐藏默认图' : '显示默认图';
}
async function getOutputs(item) {
  if (!item.compositeCache) {
    item.compositeCache = await compositeFrames(item);
  }
  return item.compositeCache;
}
async function downloadZip(item) {
  try {
    const blobs = await getOutputs(item);
    const files = [];

    if (showDefaults && item.defaultBlob) {
      files.push({
        name: `${item.baseName}_default.png`,
        data: new Uint8Array(await item.defaultBlob.arrayBuffer())
      });
    }
    for (let i = 0; i < blobs.length; i++) {
      files.push({ name: frameName(item, i), data: new Uint8Array(await blobs[i].arrayBuffer()) });
    }
    saveBlob(buildZip(files), `${item.baseName}_frames.zip`);
  } catch (e) {
    console.error(e);
    alert('打包失败：' + e.message);
  }
}
async function downloadEach(item) {
  try {

    if (showDefaults && item.defaultBlob) {
      saveBlob(item.defaultBlob, `${item.baseName}_default.png`);
      await sleep(180);
    }
    const blobs = await getOutputs(item);
    for (let i = 0; i < blobs.length; i++) {
      saveBlob(blobs[i], frameName(item, i));
      await sleep(180);
    }
  } catch (e) {
    console.error(e);
    alert('下载失败：' + e.message);
  }
}
btnZipAll.addEventListener('click', async () => {
  if (!items.length) return;
  const oldText = btnZipAll.textContent;
  btnZipAll.disabled = true;
  btnZipAll.textContent = '打包中…';
  try {
    const files = [];
    const used = new Set();
    for (const item of items) {
      // 保证 ZIP 内前缀不重复
      let prefix = item.baseName;
      if (used.has(prefix)) {
        let k = 2;
        while (used.has(`${prefix}_${k}`)) k++;
        prefix = `${prefix}_${k}`;
      }
      used.add(prefix);
      if (showDefaults && item.defaultBlob) {
        files.push({
          name: `${prefix}_default.png`,
          data: new Uint8Array(await item.defaultBlob.arrayBuffer())
        });
      }

      const blobs = await getOutputs(item);
      for (let i = 0; i < blobs.length; i++) {
        files.push({
          name: `${prefix}_frame_${pad3(i)}.png`,
          data: new Uint8Array(await blobs[i].arrayBuffer())
        });
      }
    }
    saveBlob(buildZip(files), `apng_frames_${items.length}files.zip`);
  } catch (e) {
    console.error(e);
    alert('打包失败：' + e.message);
  } finally {
    btnZipAll.disabled = false;
    btnZipAll.textContent = oldText;
  }
});
</script>
